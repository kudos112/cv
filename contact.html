<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Abdul Quddoos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/lux/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">Abdul Quddoos</a>
  </div>
</nav>
<main class="container py-5">
    <h1 class="mb-4 text-center">Contact Details</h1>
    <p>Email: <a href="mailto:Quddoux112@gmail.com">Quddoux112@gmail.com</a></p>
    <p>Phone: 03099091509</p>
    <form action="mailto:Quddoux112@gmail.com" method="post" class="mt-4">
        <h2 class="h4 mb-3">Leave a Message</h2>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</main>
<footer class="bg-light text-center py-4">
    <div class="container">
        <p class="mb-0"><a href="index.html">Back to Home</a></p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
