<!DOCTYPE html>
<html>
<head>
    <title>Mian's Contact</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</head>
<body>
    <header>
        <div class="profile">
            <h1>Contact</h1>
            <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
        </div>
    </header>
    <div class="container">
        <h2>My Contact Details:</h2>
        <p>Email: <a href="mailto:Quddoux112@gmail.com">Quddoux112@gmail.com</a><br>
           Phone: 03099091509</p>
        <form action="mailto:Quddoux112@gmail.com" method="post" enctype="text/plain">
            <label>Name:</label>
            <input type="text" name="Name" />
            <label>Email:</label>
            <input type="email" name="Email" />
            <label>Description:</label>
            <textarea name="Message" rows="5" cols="33"></textarea>
            <input type="submit" value="Send" />
        </form>
    </div>
</body>
</html>
